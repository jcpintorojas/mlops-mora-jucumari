<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riesgo de mora · Jucumari</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6fa; color: #1d2433; margin: 0; }
  header { background: #1f3864; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 20px; } header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  main { max-width: 1000px; margin: 20px auto; padding: 0 16px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h2 { font-size: 16px; margin: 0 0 12px; color: #1f3864; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { font-size: 12px; color: #555; display: block; }
  input, select { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #c8cfdc; border-radius: 6px; font-size: 14px; }
  .botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  button { border: 0; border-radius: 6px; padding: 9px 14px; font-size: 14px; cursor: pointer; background: #2e5597; color: #fff; }
  button.sec { background: #e3e8f2; color: #1f3864; }
  .barra { height: 22px; background: #e3e8f2; border-radius: 11px; overflow: hidden; margin: 8px 0; }
  .relleno { height: 100%; width: 0; transition: width .4s; }
  .grande { font-size: 30px; font-weight: 700; }
  .ok { color: #38761d; } .mal { color: #b00020; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } td { padding: 4px 0; border-bottom: 1px solid #eef; }
  td:first-child { color: #666; } code { font-size: 12px; }
  #pods div { font-size: 13px; margin: 3px 0; }
</style>
</head>
<body>
<!-- Encabezado de la página -->
<header>
  <h1>Riesgo de mora de un crédito · Jucumari</h1>
  <p>Interfaz que consume la API desplegada en Kubernetes (Service mora-api) · Julio Cesar Pinto Rojas - David Valverde Andia</p>
</header>
<main>
  <!-- Formulario: el JavaScript genera sus campos -->
  <section class="card">
    <h2>Datos del cliente</h2>
    <div class="botones" style="margin:0 0 12px">
      <button class="sec" onclick="cargar('bajo')">Ejemplo: riesgo bajo</button>
      <button class="sec" onclick="cargar('alto')">Ejemplo: riesgo alto</button>
    </div>
    <div class="grid" id="form"></div>
    <div class="botones">
      <button onclick="evaluar()">Evaluar crédito</button>
      <button class="sec" onclick="rafaga()">Enviar 20 peticiones (ver balanceo)</button>
    </div>
  </section>
  <!-- Resultado de la API y reparto entre Pods -->
  <section class="card">
    <h2>Resultado</h2>
    <div id="resultado">Completa los datos y presiona «Evaluar crédito».</div>
    <h2 style="margin-top:20px">Pods que atendieron</h2>
    <div id="pods">—</div>
  </section>
</main>
<script>
// Ruta relativa: va a nginx, dentro del clúster, y nginx la reenvía a la API.
const API = "/api";  // nginx reenvía /api al Service mora-api del clúster
// Dos créditos inventados con las variables que exige la API.
const EJEMPLOS = {
  bajo: {monto_total: 6000, pct_inicial: 0.3, n_lineas: 1, n_creditos_previos: 4, monto_previo: 20000, n_previos_maduros: 4, n_previos_mora30: 0, max_dias_atraso_previo: 0, saldo_abierto_previo: 0, meses_desde_primera_venta: 18, n_contado_previos: 3, plazo_cat: "1", atraso_previo: "no", con_plan: "no"},
  alto: {monto_total: 45000, pct_inicial: 0, n_lineas: 3, n_creditos_previos: 6, monto_previo: 90000, n_previos_maduros: 5, n_previos_mora30: 3, max_dias_atraso_previo: 120, saldo_abierto_previo: 15000, meses_desde_primera_venta: 24, n_contado_previos: 1, plazo_cat: "1", atraso_previo: "si", con_plan: "no"},
};
// Campos del formulario; los que traen opciones son categóricos.
const CAMPOS = [
  ["monto_total", "Monto de la venta (Bs)"], ["pct_inicial", "Parte pagada al vender (0 a 1)"],
  ["plazo_cat", "Plazo (meses)", [["1","1"],["2-3","2-3"],["4-6","4-6"],["7+","7 o más"],["dias","En días"]]],
  ["atraso_previo", "Cómo pagó su último crédito", [["no","A tiempo"],["si","Con atraso"],["sin_historial","Sin historial"]]],
  ["n_creditos_previos", "Créditos anteriores"], ["n_previos_mora30", "De ellos, atrasados"],
  ["max_dias_atraso_previo", "Mayor atraso (días)"], ["saldo_abierto_previo", "Saldo que aún debe (Bs)"],
  ["meses_desde_primera_venta", "Meses como cliente"], ["n_contado_previos", "Compras al contado"],
];
// Cliente base: aporta las variables que no aparecen en el formulario.
let base = {...EJEMPLOS.bajo};
const form = document.getElementById("form");
// Crea cada campo: una lista si tiene opciones; si no, un número.
for (const [id, txt, opts] of CAMPOS) {
  const d = document.createElement("div");
  d.innerHTML = `<label for="${id}">${txt}</label>` + (opts
    ? `<select id="${id}">${opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>`
    : `<input id="${id}" type="number">`);
  form.appendChild(d);
}
// Llena el formulario con un ejemplo.
function cargar(nombre) {
  base = {...EJEMPLOS[nombre]};
  for (const [id] of CAMPOS) document.getElementById(id).value = base[id];
}
// Combina el cliente base con lo escrito en el formulario.
function leer() {
  const c = {...base};
  for (const [id, , opts] of CAMPOS) c[id] = opts ? document.getElementById(id).value : Number(document.getElementById(id).value);
  return c;
}
// Llama a la API desplegada en Kubernetes y devuelve su respuesta.
async function pedir() {
  const r = await fetch(`${API}/predict`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(leer())});
  const d = await r.json();
  if (!r.ok) throw new Error(JSON.stringify(d.detail || d));
  return d;
}
// Muestra probabilidad, versión del modelo, run y Pod.
function mostrar(d) {
  const p = d.probabilidad_mora, mal = d.prediccion === "riesgo_alto";
  document.getElementById("resultado").innerHTML = `
    <div class="grande ${mal ? "mal" : "ok"}">${(p * 100).toFixed(1)} %</div>
    <div>probabilidad de atraso de más de 30 días</div>
    <div class="barra"><div class="relleno" style="width:${p * 100}%;background:${mal ? "#cc0000" : "#6aa84f"}"></div></div>
    <p><b class="${mal ? "mal" : "ok"}">${mal ? "Riesgo alto: es un aviso, no una decisión" : "Riesgo normal"}</b> (umbral 50 %)</p>
    <table>
      <tr><td>Modelo</td><td><code>${d.modelo.nombre}@${d.modelo.alias}</code></td></tr>
      <tr><td>Versión del registro</td><td><code>${d.modelo.version}</code></td></tr>
      <tr><td>Run de MLflow</td><td><code>${d.modelo.run_id}</code></td></tr>
      <tr><td>Pod que respondió</td><td><code>${d.pod}</code></td></tr>
    </table>`;
}
// Botón Evaluar crédito: una petición.
async function evaluar() {
  try { const d = await pedir(); mostrar(d); document.getElementById("pods").innerHTML = `<div>1 × <code>${d.pod}</code></div>`; }
  catch (e) { document.getElementById("resultado").innerHTML = `<span class="mal">Error: ${e.message}</span>`; }
}
// Botón de 20 peticiones: cuenta cuántas atendió cada Pod.
async function rafaga() {
  const cuenta = {}; let ultima;
  for (let i = 0; i < 20; i++) { try { ultima = await pedir(); cuenta[ultima.pod] = (cuenta[ultima.pod] || 0) + 1; } catch (e) {} }
  if (ultima) mostrar(ultima);
  document.getElementById("pods").innerHTML = Object.entries(cuenta).sort()
    .map(([pod, n]) => `<div>${n} × <code>${pod}</code></div>`).join("") || "sin respuestas";
}
cargar("bajo");
</script>
</body>
</html>
